name: ci
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # ffmpeg for the audio tests and audio:check (they decode and measure the shipped files)
      - run: command -v ffprobe || (sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg)
      - run: npm run check
      - run: npm test
      - run: npm run levels:check
      - run: npm run audio:check
      - run: npm run build
      - run: npm run size
      - run: npm run zip:only
      - uses: actions/upload-artifact@v4
        with:
          name: submission-zip
          path: release/*.zip
          retention-days: 14
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: test-results
          retention-days: 7
